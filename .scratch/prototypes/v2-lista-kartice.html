      <div id="app" class="absolute inset-x-0 bottom-0 top-7 overflow-hidden ${v.theme.font || ''}"></div>
    </div></div>${EMBED ? '' : '<div id="dev"></div>'}`);
  document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; const a = A[el.dataset.a]; if (a) { e.preventDefault(); a(el.dataset.v, el); } });
  document.addEventListener('input', e => { if (e.target.matches('[data-desc]')) S.desc = e.target.value; });
  document.addEventListener('keydown', e => {
    if (EMBED || e.target.closest('input, textarea, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
    const i = VARIANTS.findIndex(x => x.id === V.id), n = VARIANTS.length;

    else if (e.key === 'ArrowRight') location.href = VARIANTS[(i + 1) % n].file;

  });
  setInterval(() => { if (S.t0 && !S.t1) updateOverlay(); }, 500);

          ${r.desc ? card(`<div class="p-4">${cardTitle('fileText', 'Opis problema')}<p class="mt-1.5 text-[15px] text-slate-700">${esc(r.desc)}</p></div>`) : ''}
          ${card(`<div class="p-4">${cardTitle('building', 'Nadležna institucija')}${inst ? `<p class="mt-1.5 text-[15px]">${inst.name}</p>${inst.cc ? `<p class="text-sm text-slate-500">Kopija: ${inst.cc}</p>` : ''}<button data-a="why" data-v="${r.cat}" class="h-11 -mb-2 text-sm font-medium text-blue-700">Zašto ova institucija?</button>` : '<p class="mt-1.5 text-[15px] text-slate-700">Nadležnu instituciju određuje tim Fixit.</p>'}</div>`)}
          ${card(`<div class="p-4">${cardTitle('clock', 'Vremenska linija')}<ol class="mt-3 space-y-3">${r.events.slice().reverse().map(e => { const em = STATUS[e.s]; return `<li class="flex gap-3"><span class="w-8 h-8 shrink-0 rounded-full text-white flex items-center justify-center" style="background:${em.hex}">${ic(em.icon, 'w-4 h-4')}</span><div class="min-w-0"><div class="text-sm"><b>${em.label}</b> <span class="text-slate-500">· ${dateAgo(e.ago)}</span></div>${e.t ? `<p class="text-sm text-slate-700">${esc(e.t)}</p>` : ''}<p class="text-xs text-slate-500">${esc(e.a)}</p></div></li>`; }).join('')}</ol></div>`)}
        </div></div></div>`;
  },
};
boot({ id: 'v2', name: 'Lista i kartice', theme: T, screens });

</script>
</body>
</html>
